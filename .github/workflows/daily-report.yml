name: MapSwipe daily report

on:
  schedule:
    - cron: '0 5 * * *'   # every day at 05:00 UTC (07:00 in Poland in summer, 06:00 in winter)
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ['report/**', '.github/workflows/daily-report.yml']

permissions:
  contents: write   # save report/snapshots.json back to the repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build report from MapSwipe open data
        run: node report/build.js

      - name: Save daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/snapshots.json
          git diff --cached --quiet || git commit -m "Update MapSwipe snapshot $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
